services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/aura
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:3000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - aura-uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: services/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  aura-postgres:
  aura-uploads:
